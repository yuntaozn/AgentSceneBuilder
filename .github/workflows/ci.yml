name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check registry
        run: npm run registry:check

      - name: Check CLI syntax
        run: |
          node --check packages/cli/src/agentscene.mjs
          node --check scripts/model.mjs

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Build library
        run: npm run build:library

      - name: Build editor
        run: npm run build:editor
