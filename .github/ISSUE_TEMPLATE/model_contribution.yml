name: Model or method contribution
description: Propose a registry component, complete model, or spatial method.
title: "[Registry]: "
labels:
  - registry
body:
  - type: dropdown
    id: kind
    attributes:
      label: Entry kind
      options:
        - component
        - method
        - composition
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Agent value
      description: What repeated Agent work does this remove?
    validations:
      required: true
  - type: textarea
    id: parameters
    attributes:
      label: Parameters and editable parts
      description: List dimensions, anchors, paths, repetition rules, or quality checks.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional public references or examples. Do not include proprietary materials.
