name: Feature request
description: Suggest an improvement to the core, CLI, registry, editor, or plugin packaging.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Agent or human workflow is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: What should AgentSceneBuilder provide?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core / CompositionSpec
        - CLI / Skill / Plugin
        - Registry
        - Editor / Library
        - Renderer / Adapter
        - Documentation
