name: Bug report
description: Report a reproducible problem in AgentSceneBuilder.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include CLI commands, registry entry IDs, editor steps, or input JSON.
      placeholder: |
        node packages/cli/src/agentscene.mjs ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser if relevant.
